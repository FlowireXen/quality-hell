[mod-setting-description]
SEMBY_unlocked=If "Checked", start with ALL qualities unlocked. If "Unchecked", start with "uncommon" and "rare" qualities unlocked. Enemies always have all qualities unlocked.
SEMBY_science_discount=Technologies that ONLY unlock a new quality, have their cost (amount of needed science packs) reduced by this percentage. ["0%" = Disable] ["100%" = Sets cost to "1"]
SEMBY_handcraft=Percentage chance for hand-crafted items to have a higher quality. Only affects the final result. ["0%" = Disable]
SEMBY_quality_machine=Base quality percentage for all machines and furnaces. ["0%" = Disable]
SEMBY_quality_miner=Base quality percentage for all miners. ["0%" = Disable]
SEMBY_allow_quality=Some recipes ignore the quality-modifier and ban the use of quality-modules by default. When this is checked, all recipes will allow the quality-modifier and the use of quality modules. ["Checked" = Space casino!] ["Unchecked" = Boring]
SEMBY_asteroid=Percentage chance for asteroids to have a higher quality. Quality asteroids do not drop quality asteroid chunks. ["0%" = Disable]
SEMBY_asteroid_shuffle=If "Checked", asteroids use the quality-chance to apply a *random* quality (e.G. "20%" chance to get *any* quality). If "Unchecked", roll for quality like usual (resulting in mostly "uncommon" asteroids).
SEMBY_structure=Percentage chance for nests/spawners, egg rafts and worms to have a higher quality. Affects newly generated chunks and expansion parties. ["0%" = Disable]
SEMBY_structure_distance=Each chunk after the "Grace-Distance" adds this percentage to the quality-chance (further from spawn -> higher quality). ["0%" = Disable]
SEMBY_structure_evolution=Evolution affects the quality-chance: e.G.: "10%" means when evolution is at "80%", add (80*10%=)"8%" to the quality-chance. ["0%" = Disable]
SEMBY_entity=Percentage chance for enemies (biters, pentapods, etc.) to have a higher quality. Affects all newly spawned enemies. Warning/e.G.: An "uncommon" nest uses *this* chance to spawn "rare" enemies. ["0%" = Disable]
SEMBY_entity_distance=Each chunk after the "Grace-Distance" adds this percentage to the quality-chance (further from spawn -> higher quality). ["0%" = Disable]
SEMBY_entity_evolution=Evolution affects the quality-chance: e.G.: "10%" means when evolution is at "80%", add (80*10%=)"8%" to the quality-chance. ["0%" = Disable]
SEMBY_segentity=Percentage chance for Demolishers (or "Segmented Entities") to have a higher quality. Affects newly generated chunks and spawned entities. ["0%" = Disable]
SEMBY_segentity_distance=Each chunk after the "Grace-Distance" adds this percentage to the quality-chance (further from spawn -> higher quality). ["0%" = Disable]
SEMBY_segentity_evolution=Evolution affects the quality-chance: e.G.: "10%" means when evolution is at "80%", add (80*10%=)"8%" to the quality-chance. ["0%" = Disable]
SEMBY_grace_distance=Start of all "distance" calculations (in chunks).
